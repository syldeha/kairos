[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.2.0"
description = "A meeting assistant that knows when to speak, what to say, and when to stay quiet."
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["kairos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
